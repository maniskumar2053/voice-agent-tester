[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent-tester"
version = "0.1.0"
description = "A safety-guarded automated patient that tests a phone voice agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.75,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "twilio>=9.4,<10",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
voice-tester = "voice_tester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_tester"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

